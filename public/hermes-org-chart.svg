  <line x1="760" y1="270" x2="760" y2="296" stroke="#525252" stroke-width="2"/>
  <line x1="120" y1="296" x2="760" y2="296" stroke="#525252" stroke-width="2"/>
  <line x1="320" y1="296" x2="320" y2="310" stroke="#525252" stroke-width="2"/>
  <line x1="560" y1="296" x2="560" y2="310" stroke="#525252" stroke-width="2"/>

  <!-- VPs -->
  <g transform="translate(160, 310)">
    <rect width="200" height="42" rx="8" fill="url(#vpGrad)"/>
    <text x="100" y="332" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f5f5f5">VP Engineering</text>
    <text x="100" y="346" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#e5e5e5">code · review · architecture</text>
  </g>
  <g transform="translate(380, 310)">
    <rect width="200" height="42" rx="8" fill="url(#vpGrad)"/>
    <text x="100" y="332" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f5f5f5">VP Infrastructure</text>
    <text x="100" y="346" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#e5e5e5">security · sre · deployments</text>
  </g>
  <g transform="translate(600, 310)">
    <rect width="200" height="42" rx="8" fill="url(#vpGrad)"/>
    <text x="100" y="332" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f5f5f5">VP Product</text>
    <text x="100" y="346" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#e5e5e5">product · clients · kanban</text>
  </g>

  <!-- Lines VPs -> Agents -->
