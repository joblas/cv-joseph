  <line x1="480" y1="352" x2="480" y2="372" stroke="#525252" stroke-width="2"/>
  <line x1="700" y1="352" x2="700" y2="372" stroke="#525252" stroke-width="2"/>
  <line x1="100" y1="372" x2="820" y2="372" stroke="#525252" stroke-width="2"/>

