<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="hermes-org-title hermes-org-desc">
  <title id="hermes-org-title">JTS Hermes Org Chart v5.1</title>
  <desc id="hermes-org-desc">Org chart showing Joe Blas as CEO, Lurkr as CTO, four C-suite skills, three VPs, and fourteen agents.</desc>
  <defs>
    <linearGradient id="ceoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="execGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="vpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="agentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="880" height="560" fill="#0a0a0a"/>
  <text x="440" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f5f5f5">Hermes Command Center — JTS Org Chart v5.1</text>
  <text x="440" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#a3a3a3">14 agents routed through Ollama Cloud model selection</text>

  <!-- CEO -->
  <rect x="380" y="80" width="120" height="44" rx="8" fill="url(#ceoGrad)"/>
  <text x="440" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0a0a0a">Joe Blas</text>
  <text x="440" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#0a0a0a">CEO</text>

  <!-- Line CEO -> CTO -->
  <line x1="440" y1="124" x2="440" y2="150" stroke="#525252" stroke-width="2"/>

  <!-- CTO -->
  <rect x="360" y="150" width="160" height="48" rx="8" fill="#1f2937" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f5f5f5">Lurkr</text>
  <text x="440" y="188" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#a3a3a3">CTO · Main agent</text>

  <!-- Line CTO -> C-suite -->
  <line x1="440" y1="198" x2="440" y2="224" stroke="#525252" stroke-width="2"/>
  <line x1="120" y1="224" x2="760" y2="224" stroke="#525252" stroke-width="2"/>

  <!-- C-suite skills -->
  <g transform="translate(40, 230)">
    <rect width="160" height="40" rx="8" fill="url(#execGrad)"/>
    <text x="80" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#f5f5f5">Chief of Staff</text>
    <text x="80" y="262" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#e5e5e5">Personal lane</text>
  </g>
  <g transform="translate(240, 230)">
    <rect width="160" height="40" rx="8" fill="url(#execGrad)"/>
    <text x="80" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#f5f5f5">CFO</text>
    <text x="80" y="262" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#e5e5e5">Finance</text>
  </g>
  <g transform="translate(440, 230)">
    <rect width="160" height="40" rx="8" fill="url(#execGrad)"/>
    <text x="80" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#f5f5f5">COO</text>
    <text x="80" y="262" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#e5e5e5">Operations</text>
  </g>
  <g transform="translate(640, 230)">
    <rect width="160" height="40" rx="8" fill="url(#execGrad)"/>
    <text x="80" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#f5f5f5">CMO</text>
    <text x="80" y="262" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#e5e5e5">Marketing</text>
  </g>

  <!-- Lines C-suite -> VPs -->
