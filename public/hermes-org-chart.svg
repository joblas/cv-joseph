  <g font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#f5f5f5" text-anchor="middle">
    <rect x="60" y="378" width="90" height="30" rx="6" fill="url(#agentGrad)"/>
    <text x="105" y="392">code-implementer</text>
    <text x="105" y="403" font-size="7" fill="#e5e5e5">kimi-k2.7-code</text>

    <rect x="165" y="378" width="90" height="30" rx="6" fill="url(#agentGrad)"/>
    <text x="210" y="392">code-reviewer</text>
    <text x="210" y="403" font-size="7" fill="#e5e5e5">qwen3-coder-next</text>

    <rect x="270" y="378" width="90" height="30" rx="6" fill="url(#agentGrad)"/>
    <text x="315" y="392">code-architect</text>
    <text x="315" y="403" font-size="7" fill="#e5e5e5">glm-5.2</text>

    <rect x="375" y="378" width="90" height="30" rx="6" fill="url(#agentGrad)"/>
    <text x="420" y="392">security-auditor</text>
    <text x="420" y="403" font-size="7" fill="#e5e5e5">glm-5.2</text>

    <rect x="480" y="378" width="90" height="30" rx="6" fill="url(#agentGrad)"/>
    <text x="525" y="392">sre</text>
    <text x="525" y="403" font-size="7" fill="#e5e5e5">deepseek-v4-pro</text>

    <rect x="585" y="378" width="90" height="30" rx="6" fill="url(#agentGrad)"/>
    <text x="630" y="392">test-runner</text>
    <text x="630" y="403" font-size="7" fill="#e5e5e5">gpt-oss:20b</text>

    <rect x="690" y="378" width="90" height="30" rx="6" fill="url(#agentGrad)"/>
    <text x="735" y="392">hermes-stack-deploy</text>
    <text x="735" y="403" font-size="7" fill="#e5e5e5">deepseek-v4-pro</text>

    <rect x="40" y="418" width="90" height="30" rx="6" fill="url(#agentGrad)"/>
    <text x="85" y="432">product-manager</text>
    <text x="85" y="443" font-size="7" fill="#e5e5e5">minimax-m3</text>

    <rect x="145" y="418" width="90" height="30" rx="6" fill="url(#agentGrad)"/>
    <text x="190" y="432">skate-workshop-app</text>
    <text x="190" y="443" font-size="7" fill="#e5e5e5">kimi-k2.7-code</text>

    <rect x="250" y="418" width="90" height="30" rx="6" fill="url(#agentGrad)"/>
    <text x="295" y="432">kanban</text>
    <text x="295" y="443" font-size="7" fill="#e5e5e5">minimax-m3</text>

    <rect x="355" y="418" width="90" height="30" rx="6" fill="url(#agentGrad)"/>
    <text x="400" y="432">content-creator</text>
    <text x="400" y="443" font-size="7" fill="#e5e5e5">minimax-m3</text>

    <rect x="460" y="418" width="90" height="30" rx="6" fill="url(#agentGrad)"/>
    <text x="505" y="432">client-research</text>
    <text x="505" y="443" font-size="7" fill="#e5e5e5">minimax-m3</text>

    <rect x="565" y="418" width="90" height="30" rx="6" fill="url(#agentGrad)"/>
    <text x="610" y="432">resume-cv</text>
    <text x="610" y="443" font-size="7" fill="#e5e5e5">minimax-m3</text>

    <rect x="670" y="418" width="90" height="30" rx="6" fill="url(#agentGrad)"/>
    <text x="715" y="432">job-search-agent</text>
    <text x="715" y="443" font-size="7" fill="#e5e5e5">minimax-m3</text>
  </g>

  <text x="440" y="478" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#a3a3a3">Models are picked per task via Ollama Cloud · NVIDIA NIM fallback</text>
  <text x="440" y="498" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#a3a3a3">Skills: MemPalace memory · Superpowers · Cron jobs · GitNexus code graph</text>
</svg>