name: cf-pages

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy target
        id: tgt
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "branch=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
            echo "kind=preview" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "kind=production" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        run: npm ci
      # Gate the deploy on the offline suites. Until 2026-09-20 this workflow ran
      # no tests at all, so every tests/*.test.ts in the repo was decorative — a
      # test added in a PR could never fail CI on that PR or any later one.
      # Only the suites that need no secrets and no live endpoint belong here:
      # test:contract needs LANGFUSE_*, and test:ops probes the deployed site and
      # fails parsing a 200 that returns the SPA HTML shell (not, as first
      # written here, a 503) — both environmental, neither about the code.
      - name: Test
        run: |
          npm run test:rag-hybrid
          npm run test:rag-query
          npm run test:personas
          npm run test:spoken
          npm run test:voice-search
          npm run test:agent-prompts
      - name: Build (static site + Pages Functions)
        run: |
          npm run cf:prep   # api/ → functions/api-src/ (Workers shims), prompt module
          npm run build
          npm run cf:post   # _headers/_redirects from vercel.json into dist/
      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          set -o pipefail; npx wrangler pages deploy dist --project-name cloudyjoe --branch "${{ steps.tgt.outputs.branch }}" --commit-dirty=true 2>&1 | tee /tmp/deploy.log; PIPESTATUS=( "${PIPESTATUS[@]}" ); set -o pipefail
          URL=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' /tmp/deploy.log | tail -1 || true)
          [[ -n "$URL" ]] && echo "url=$URL" >> "$GITHUB_OUTPUT" || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 18425cc3e007fff18646960dfc1e9c66
      - name: Comment preview URL
        if: steps.tgt.outputs.kind == 'preview'
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.DEPLOY_URL || '(url unavailable — check Actions log)';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 CF Pages preview: ' + url
            })
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
