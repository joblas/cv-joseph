name: cf-pages

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy target
        id: tgt
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "branch=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
            echo "kind=preview" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "kind=production" >> "$GITHUB_OUTPUT"
          fi
      - name: Install + build (static site + Pages Functions)
        run: |
          npm ci
          npm run cf:prep   # api/ → functions/api-src/ (Workers shims), prompt module
          npm run build
          npm run cf:post   # _headers/_redirects from vercel.json into dist/
      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          set -o pipefail; npx wrangler@3 pages deploy dist --project-name cloudyjoe --branch "${{ steps.tgt.outputs.branch }}" --commit-dirty=true 2>&1 | tee /tmp/deploy.log; PIPESTATUS=( "${PIPESTATUS[@]}" ); set -o pipefail
          URL=$(grep -oE 'https://[a-z0-9]+\.(cf|pages)\.dev[^ ]*' /tmp/deploy.log | tail -1 || true)
          [[ -n "$URL" ]] && echo "url=$URL" >> "$GITHUB_OUTPUT" || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 18425cc3e007fff18646960dfc1e9c66
      - name: Comment preview URL
        if: steps.tgt.outputs.kind == 'preview'
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.DEPLOY_URL || '(url unavailable — check Actions log)';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 CF Pages preview: ' + url
            })
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
